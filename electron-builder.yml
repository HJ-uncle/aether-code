appId: com.electron.app
productName: aether-code
# Preserve the installed profile name; development checkouts historically use "Aether Code".
extraMetadata:
  productName: aether-code
protocols:
  - name: Aether 会话
    schemes:
      - aether
directories:
  buildResources: build
files:
  # Only built application assets are distributable. Workspaces, user data, cached archives and toolchains must stay outside ASAR.
  - 'out/**'
  - 'resources/icon.png'
  - 'docs/plugin-api/dist/**'
afterPack: ./scripts/verify-windows-toolchains.mjs
asarUnpack:
  - resources/icon.png
  - 'out/main/**/*.ico'
  - out/main/chunks/repository-supervisor.exe
  - out/main/queue-storage-worker.cjs
win:
  executableName: aether-code
  # Re-signing the hash-pinned desktop and engine Git helpers would break their integrity checks.
  signExts: ['!repository-supervisor.exe']
  extraResources:
    # electron-builder omits node_modules at the root of each file set; the engine's own dependencies must stay nested.
    - from: resources
      to: .
      filter:
        - 'engine/win32-${arch}/**/*'
        - 'toolchains/win32-${arch}/**/*'
        # Relocated CPython can regenerate its cache; developer runs may have embedded local paths in it.
        - '!toolchains/**/__pycache__/**'
        - '!toolchains/**/*.pyc'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
