<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Aether Code AE ligature</title>
  <desc id="desc">A compact AE ligature for Aether Code: an open A joined to an editor-like E by one shared workspace rail.</desc>
  <defs>
    <linearGradient id="background" x1="84" y1="36" x2="946" y2="988" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#302F72"/>
      <stop offset="0.48" stop-color="#171B42"/>
      <stop offset="1" stop-color="#090D21"/>
    </linearGradient>
    <linearGradient id="aether" x1="188" y1="836" x2="834" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3F9BFF"/>
      <stop offset="0.48" stop-color="#718DFF"/>
      <stop offset="1" stop-color="#C075FF"/>
    </linearGradient>
    <linearGradient id="letter-light" x1="376" y1="218" x2="826" y2="818" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="0.58" stop-color="#E5EAFF"/>
      <stop offset="1" stop-color="#CBB8FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.86">
      <stop offset="0" stop-color="#8D8BFF" stop-opacity="0.2"/>
      <stop offset="0.52" stop-color="#5F8FFF" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#5F8FFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#background)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>
  <rect x="4" y="4" width="1016" height="1016" rx="226" fill="none" stroke="#FFFFFF" stroke-opacity="0.085" stroke-width="8"/>

  <!-- The AE ligature is intentionally one system: Aether's open A becomes the left rail of a shared workspace mark. -->
  <path d="M205 812 L386 214 L560 812" fill="none" stroke="url(#aether)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M291 548 H496" fill="none" stroke="#F5F7FF" stroke-width="78" stroke-linecap="round"/>

  <!-- The E is reduced to an editor spine and three rails; its middle rail joins the A crossbar as the ligature. -->
  <path d="M590 214 V812" fill="none" stroke="url(#letter-light)" stroke-width="92" stroke-linecap="round"/>
  <path d="M590 214 H830 M496 548 H795 M590 812 H830" fill="none" stroke="url(#letter-light)" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
